[package]
name = "alchemist"
version = "0.7.0"
description = "Alchemist: record, edit, convert, compress and enhance video. Locally."
authors = ["Alchemist contributors"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "alchemist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
once_cell = "1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
log = "0.4"
cpal = "0.15"
hound = "3"
rdev = "0.5"
semver = "1"
png = "0.17"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_System_ProcessStatus"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
debug = false
split-debuginfo = "packed"

[profile.dev]
debug = 1
